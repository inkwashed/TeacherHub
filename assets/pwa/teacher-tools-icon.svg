<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Theme palette: override these variables when inline, or edit these defaults for img/favicon use. -->
  <style>
    .sky{fill:var(--logo-sky,#bdd8f6)}
    .orbit{stroke:var(--logo-ring,#7ea9e5)}
    .paper{fill:var(--logo-paper,#fffefa)}
    .fold{fill:var(--logo-fold,#d8dedf)}
    .edge{stroke:var(--logo-ink,#263f36);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
  </style>
  <circle class="sky" cx="33.5" cy="33.5" r="28"/>
  <circle class="orbit" cx="30.8" cy="30.8" r="27.8" stroke-width=".75"/>
  <!-- Center the book and airplane together over the unchanged circles. -->
  <g transform="translate(0 -3)">
  <!-- Book sits behind the original, full-size airplane. -->
  <g stroke="var(--logo-ink,#263f36)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
    <path class="paper" d="M10 45 Q20 42 30 48 Q40 42 50 45 L50 57 Q40 54 30 60 Q20 54 10 57Z"/>
    <path d="M30 48V60"/>
  </g>
  <path class="orbit" d="M15 49 Q21 48 26 51 M15 53 Q21 52 26 55 M34 51 Q39 48 45 49 M34 55 Q39 52 45 53" stroke-width="1" stroke-linecap="round"/>
  <!-- Full-size airplane raised four units; drawn last to stay in front. -->
  <g transform="translate(0 -4)">
  <path class="paper edge" d="M5 26.5 57 21 44.5 54 29 42 19.5 49 19.5 35Z"/>
  <path class="fold edge" d="M19.5 35 57 21 26 39 19.5 49Z"/>
  <path class="paper edge" d="M26 39 44.5 54 57 21Z"/>
  <path class="edge" d="M26 39 29 42 19.5 49"/>
  </g>
  </g>
</svg>
